<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Almendra:wght@400;700&amp;display=swap');
    </style>
    <linearGradient id="fadeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f4e4c1"/>
      <stop offset="20%" stop-color="#c4a35a"/>
      <stop offset="50%" stop-color="#b8860b"/>
      <stop offset="80%" stop-color="#c4a35a"/>
      <stop offset="100%" stop-color="#f4e4c1"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="#f4e4c1"/>

  <!-- Top decorative border -->
  <rect y="60" width="1200" height="2" fill="url(#fadeGradient)"/>
  <text x="600" y="40" text-anchor="middle" font-family="serif" font-size="24" fill="#5c4033">✦</text>

  <!-- Bottom decorative border -->
  <rect y="568" width="1200" height="2" fill="url(#fadeGradient)"/>
  <text x="600" y="605" text-anchor="middle" font-family="serif" font-size="24" fill="#5c4033">✦</text>

  <!-- Crescent moon - two circles -->
  <circle cx="520" cy="280" r="80" fill="#2d4a2d"/>
  <circle cx="555" cy="280" r="65" fill="#f4e4c1"/>

  <!-- Star -->
  <polygon points="660,220 675,260 720,265 688,295 696,340 660,315 624,340 632,295 600,265 645,260" fill="#2d4a2d"/>

  <!-- Title -->
  <text x="600" y="480" text-anchor="middle" font-family="Almendra, serif" font-size="52" fill="#1a0f0a">Tales of the Arabian Nights</text>
  <text x="600" y="530" text-anchor="middle" font-family="Almendra, serif" font-size="28" fill="#5c4033">Encounter Lookup Tool</text>
</svg>
