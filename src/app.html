<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#3d5a3d" />

		<!-- Default metadata (can be overridden by pages) -->
		<title>Tales of the Arabian Nights - Encounter Lookup</title>
		<meta
			name="description"
			content="A companion tool for Tales of the Arabian Nights board game. Look up encounters and reaction matrices quickly."
		/>

		<!-- Open Graph / Social -->
		<meta property="og:type" content="website" />
		<meta property="og:title" content="Tales of the Arabian Nights - Encounter Lookup" />
		<meta
			property="og:description"
			content="A companion tool for Tales of the Arabian Nights board game. Look up encounters and reaction matrices quickly."
		/>
		<meta property="og:image" content="%sveltekit.assets%/og-image.png" />

		<!-- Twitter -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Tales of the Arabian Nights - Encounter Lookup" />
		<meta
			name="twitter:description"
			content="A companion tool for Tales of the Arabian Nights board game. Look up encounters and reaction matrices quickly."
		/>
		<meta name="twitter:image" content="%sveltekit.assets%/og-image.png" />

		<!-- Fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
			rel="stylesheet"
		/>

		<!-- Favicon -->
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/favicon.png" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
